message_hit = "Manufacturer matches a bundled telecommunications entity list entry."
message_unverified = "No manufacturer is recorded for this part, so Section 889 style telecom coverage cannot be verified."
citation = "NDAA Section 889 (Pub. L. 115-232); fixture list only in this build."

