schema = 1
id = "us_government_ndaa"
title = "US government / NDAA"
description = "Affiliation with a listed entity and whether a part is a substantial or essential component are legal judgements. PCBCraft compares recorded manufacturer names to bundled list snapshots; near-name matches are possible matches, not confirmed hits. Section 5949 rules stay unverified when only a catalog brand is known. Proposed-rule effective dates are noted in rule text and are not assumed final."

