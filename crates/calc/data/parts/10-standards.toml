term = "RoHS"
category = "standards"
short = "Restriction on hazardous substances in electrical products."
long = "RoHS limits lead and several other materials. Assembly notes record compliance for supply chain audits."
synonyms = ["lead free"]
related = ["assembly", "bom"]
units = ""
