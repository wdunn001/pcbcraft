[[term]]
id = "decoupling"
term = "Decoupling"
category = "circuit"
short = "Local capacitors that supply fast current near an integrated circuit."
long = "Decoupling capacitors sit between power and ground at each active device. Their loop area to the chip power pins should stay small on the board."
