[[term]]
id = "power_rail"
term = "Power rail"
category = "circuit"
short = "Conductive net that delivers a regulated supply voltage."
long = "Each rail feeds a group of loads. Wide copper, enough vias and local decoupling keep rail impedance low at the frequencies your loads draw."
