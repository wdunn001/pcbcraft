[[term]]
id = "microstrip"
term = "Microstrip line"
category = "circuit"
short = "Route on an outer layer over a reference plane."
long = "Microstrip impedance depends on width, dielectric thickness and permittivity. It is the common default for controlled fifty ohm digital routes."
