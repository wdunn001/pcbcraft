# Glossary part 01-circuit
schema = 1

[[term]]
id = "voltage"
term = "Voltage"
category = "circuit"
short = "Electrical potential difference between two points, in volts."
long = "Voltage drives current through a closed path. Most digital boards use a few fixed supply rails while analog sections may need tighter regulation."
synonyms = ["potential", "V"]
related = ["current", "resistance", "ohms_law"]
units = "V"
in_pcbcraft = []
search = "volt potential difference supply rail"
calculator = "ohms_law"
source = "Elementary circuit theory"

[[term]]
id = "current"
term = "Current"
category = "circuit"
short = "Flow of electric charge through a conductor, in amperes."
long = "Current sets how much heat a copper route carries and how much voltage drops across resistive paths. Return paths must carry the same net current as the supply."
synonyms = ["ampere", "I"]
related = ["voltage", "resistance", "track_width"]
units = "A"
in_pcbcraft = []
search = "ampere flow charge conductor"
calculator = "ohms_law"
source = "Elementary circuit theory"

[[term]]
id = "resistance"
term = "Resistance"
category = "circuit"
short = "Opposition to direct current flow, in ohms."
long = "Resistance converts electrical energy to heat. Copper routes, vias and component terminals all add small resistance that matters at high current."
synonyms = ["ohm", "R"]
related = ["voltage", "current", "ohms_law"]
units = "ohm"
in_pcbcraft = []
search = "ohm opposition resistor drop"
calculator = "ohms_law"
source = "Elementary circuit theory"

[[term]]
id = "ohms_law"
term = "Ohm's law"
category = "circuit"
short = "Relates voltage, current and resistance as V equals I times R."
long = "Ohm's law is the first check for power dissipation and drop budgets. Any two of voltage, current and resistance determine the third in a linear resistive path."
synonyms = ["V equals IR"]
related = ["voltage", "current", "resistance"]
units = ""
in_pcbcraft = []
search = "ohm law voltage current resistance"
calculator = "ohms_law"
source = "Elementary circuit theory"

[[term]]
id = "capacitance"
term = "Capacitance"
category = "circuit"
short = "Ability to store charge per volt, in farads."
long = "Capacitors block direct current while passing changing signals. Decoupling capacitors sit close to power pins to supply brief current pulses."
synonyms = ["capacitor", "C"]
related = ["inductance", "decoupling", "reactance"]
units = "F"
in_pcbcraft = []
search = "capacitor charge store farad"
calculator = "reactance"
source = "Elementary circuit theory"

[[term]]
id = "inductance"
term = "Inductance"
category = "circuit"
short = "Opposition to changes in current, in henries."
long = "Inductors resist fast current steps and store energy in a magnetic field. Long return paths and narrow slots raise effective inductance on power nets."
synonyms = ["inductor", "L"]
related = ["capacitance", "reactance", "decoupling"]
units = "H"
in_pcbcraft = []
search = "inductor henry magnetic field"
calculator = "reactance"
source = "Elementary circuit theory"

[[term]]
id = "reactance"
term = "Reactance"
category = "circuit"
short = "Frequency dependent opposition from capacitors or inductors."
long = "Reactance combines with resistance to form impedance. Filters and matching networks rely on reactance changing with frequency."
synonyms = ["Xc", "Xl"]
related = ["impedance", "capacitance", "inductance"]
units = "ohm"
in_pcbcraft = []
search = "ac capacitor inductor frequency"
calculator = "reactance"
source = "Elementary circuit theory"

[[term]]
id = "impedance"
term = "Impedance"
category = "circuit"
short = "Total opposition to alternating current, in ohms."
long = "Impedance sets how signals reflect at transitions. Controlled routes target a characteristic impedance such as fifty ohms for many serial links."
synonyms = ["Z", "characteristic impedance"]
related = ["microstrip", "differential_pair", "reflection", "track_width"]
units = "ohm"
in_pcbcraft = ["net.impedance"]
search = "ohm ac transmission line match fifty"
calculator = "microstrip"
