# The coordinate and rotation rules of the NeoDen YY1 job file, as one PlacementFlavour
# record (crates/io/src/placement_flavour.rs). crates/io/src/neoden_yy1.rs reads it,
# takes the numbers from `placed_rows` and adds the machine columns itself.
# Origin lower-left (lower-right for the bottom side, so X is mirrored), millimetres,
# angle 0 to 360 counter-clockwise, bottom angle negated.
id = "neoden_yy1_job"
name = "NeoDen YY1 job coordinates"
delimiter = ","
header = false
units = "mm"
decimals = 2
origin = "board_lower_left"
side_top = "T"
side_bottom = "B"
split_by_side = true
smt_only = true
dnp = "keep"
fiducials = false
bottom_rotation = "negate"
bottom_mirror_x = true
angle_range = "zero_to_360"
file_stem = "yy1"
extension = "csv"
columns = [
  { header = "Designator", field = "designator" },
  { header = "Mid X", field = "x" },
  { header = "Mid Y", field = "y" },
  { header = "Rotation", field = "rotation" },
]
