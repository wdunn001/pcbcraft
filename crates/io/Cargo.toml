[package]
name = "pcbcraft-io"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
plugin-firmware-target = ["dep:pcbcraft-plugin-sdk"]

[dependencies]
pcbcraft-clock.workspace = true
pcbcraft-geom.workspace = true
pcbcraft-doc.workspace = true
pcbcraft-library.workspace = true
pcbcraft-plugin-sdk = { workspace = true, optional = true }
pcbcraft-rules.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
image.workspace = true
png.workspace = true
base64.workspace = true
toml.workspace = true
gltf.workspace = true
truck-stepio.workspace = true
truck-meshalgo.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile.workspace = true
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile.workspace = true
