[package]
name = "pcbcraft-library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
distributor-network = ["dep:ureq", "dep:keyring"]

[dependencies]
pcbcraft-geom.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha1 = "0.10"
hmac = "0.12"
sha2.workspace = true
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"], optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
