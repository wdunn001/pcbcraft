[[pick_place.placement_rule]]
package = "Test"
skip = true
note = "A test point is a copper pad, not a part; nothing is picked."

[[pick_place.placement_rule]]
package = "Fiducial"
skip = true
note = "A fiducial is a mark, not a part."

[[pick_place.placement_rule]]
max_size_mm = 13.0
min_height_mm = 5.0
nozzle = "XN40"
speed_pct = 50
note = "Tall body (electrolytic, connector, tall inductor): the ICs 5 to 12 mm nozzle gives the widest suction face, run slower. Not in the maker guidance; check on the machine."

[[pick_place.placement_rule]]
min_size_mm = 13.01
min_height_mm = 5.0
nozzle = "XN75"
speed_pct = 50
note = "Tall and large: the largest regular nozzle, slower. Not in the maker guidance."

[[pick_place.placement_rule]]
package = "0201"
nozzle = "XN03"
speed_pct = 60
note = "Vendor guidance (XN-series table): 0201."

[[pick_place.placement_rule]]
package = "0402"
nozzle = "XN07"
note = "Vendor guidance (XN-series table): 0402."

[[pick_place.placement_rule]]
package = "0603"
nozzle = "XN07"
note = "Vendor guidance (XN-series table): 0402, 0603."

[[pick_place.placement_rule]]
package = "0805"
nozzle = "XN07"
note = "Vendor guidance (XN-series table): 0805, diodes."

[[pick_place.placement_rule]]
package = "SOD-"
nozzle = "XN07"
note = "Vendor guidance (XN-series table): diodes."

[[pick_place.placement_rule]]
package = "SMA"
nozzle = "XN07"
note = "Vendor guidance (XN-series table): diodes (SMA face 4.0 x 2.5 mm)."

[[pick_place.placement_rule]]
package = "SMB"
nozzle = "XN14"
note = "SMB face 4.0 x 3.3 mm, from the maker size table; nozzle inferred."

[[pick_place.placement_rule]]
package = "SMC"
nozzle = "XN40"
note = "SMC face 6.6 x 5.6 mm, from the maker size table; nozzle inferred."

[[pick_place.placement_rule]]
package = "1206"
nozzle = "XN14"
note = "Vendor guidance (XN-series table): 1206, 1210 (listed under two nozzles; the larger is chosen)."

[[pick_place.placement_rule]]
package = "1210"
nozzle = "XN14"
note = "Vendor guidance (XN-series table): 1206, 1210."

[[pick_place.placement_rule]]
