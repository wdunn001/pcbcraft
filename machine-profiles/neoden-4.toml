id = "neoden-4"
name = "NeoDen 4"
kind = "pick_place"
vendor = "NeoDen"
model = "4"
notes = "Nozzle set and the maker's package guidance from the XN-series nozzle table for the NeoDen 4 class (captured source in the research notes). The job file layout is NOT verified: community converters write a 7-column import list (Designator, Footprint, Mid X, Mid Y, Layer, Rotation, Comment) with an mm suffix, and the machine's own screens take feeder, head and speed. The work area is a placeholder, not a measured value. PCBCraft does not write a job file for this machine yet; the nozzle rules and checks work."

[work_area]
x = 300.0
y = 300.0
origin = "lower-left"
y_up = false

[output]
format = "csv"
dialect = "neoden_4_import"
units = "mm"
line_ending = "crlf"
mirror_bottom = false
mirror_axis = "x"
invert = false

[pick_place]
nozzle_slots = 0
default_speed_pct = 75

[[pick_place.nozzle]]
id = "XN03"
diameter_mm = 0.3
outer_diameter_mm = 0.0
packages = ["0201", "0402"]

[[pick_place.nozzle]]
id = "XN07"
diameter_mm = 0.7
outer_diameter_mm = 0.0
packages = ["0402", "0603", "0805", "SOD-", "SMA"]

[[pick_place.nozzle]]
id = "XN14"
diameter_mm = 1.4
outer_diameter_mm = 0.0
packages = ["1206", "1210", "1812", "2010", "5050", "SOT-23"]

[[pick_place.nozzle]]
id = "XN22"
diameter_mm = 2.2
outer_diameter_mm = 0.0
packages = ["SOT-89", "SOT-223", "SOT-252", "TO-252", "SOP", "SOIC", "TSSOP"]

[[pick_place.nozzle]]
id = "XN40"
diameter_mm = 4.0
outer_diameter_mm = 0.0
packages = ["QFN", "QFP", "DFN", "TQFP"]

[[pick_place.nozzle]]
id = "XN75"
diameter_mm = 7.5
outer_diameter_mm = 0.0
packages = []

