[[pick_place.placement_rule]]
package = "SOP"
nozzle = "XN22"
note = "Vendor guidance (XN-series table): SOP series ICs."

[[pick_place.placement_rule]]
package = "TSSOP"
nozzle = "XN22"
note = "Vendor guidance (XN-series table): SOP series ICs."

[[pick_place.placement_rule]]
package = "MSOP"
nozzle = "XN22"
note = "Vendor guidance (XN-series table): SOP series ICs."

[[pick_place.placement_rule]]
package = "Tact"
nozzle = "XN40"
speed_pct = 60
note = "Tactile switch: wide flat top, ICs 5 to 12 mm nozzle, slower. Not in the maker guidance."

[[pick_place.placement_rule]]
package = "Crystal"
max_size_mm = 5.0
nozzle = "XN14"
note = "Small crystal (3225 class): the 1.4 mm class nozzle. Not in the maker guidance."

[[pick_place.placement_rule]]
package = "QFN"
max_size_mm = 3.5
nozzle = "XN14"
note = "Leadless IC under 2.5 mm body: the maker lists no nozzle below SOP size; the 1.4 mm class is inferred."

[[pick_place.placement_rule]]
package = "DFN"
max_size_mm = 3.5
nozzle = "XN14"
note = "As QFN under 2.5 mm body."

[[pick_place.placement_rule]]
package = "QFN"
max_size_mm = 5.9
nozzle = "XN22"
note = "Leadless IC under 5 mm body: inferred between SOP and the 5 to 12 mm class."

[[pick_place.placement_rule]]
package = "DFN"
max_size_mm = 5.9
nozzle = "XN22"
note = "As QFN under 5 mm body."

[[pick_place.placement_rule]]
max_size_mm = 2.4
nozzle = "XN07"
note = "Any other small part by pad span: the 0402/0603 nozzle."

[[pick_place.placement_rule]]
max_size_mm = 4.6
nozzle = "XN14"
note = "Any other part up to 3.6 mm body by pad span: the 1.4 mm class."

[[pick_place.placement_rule]]
max_size_mm = 6.2
nozzle = "XN22"
note = "Any other part up to about 5 mm body: the 2.2 mm class."

[[pick_place.placement_rule]]
max_size_mm = 13.0
nozzle = "XN40"
note = "Vendor guidance (XN-series table): ICs from 5 to 12 mm (QFN, QFP, BGA, connectors) by pad span."

[[pick_place.placement_rule]]
min_size_mm = 13.01
nozzle = "XN75"
note = "Vendor guidance (XN-series table): ICs bigger than 12 mm."
