nozzle = "XN14"
note = "Vendor guidance (XN-series table): 2010."

[[pick_place.placement_rule]]
package = "2512"
nozzle = "XN22"
note = "2512 is larger than anything the maker lists for the 1.4 mm class; nozzle inferred."

[[pick_place.placement_rule]]
package = "5050"
nozzle = "XN14"
note = "Vendor guidance (XN-series table): 5050."

[[pick_place.placement_rule]]
