[package]
name = "pcbcraft-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "pcbcraft_web"
path = "src/lib.rs"

[[bin]]
name = "pcbcraft-web"
path = "src/main.rs"

[dependencies]
pcbcraft-ui-egui.workspace = true
pcbcraft-engine.workspace = true
pcbcraft-library.workspace = true
pcbcraft-mcp.workspace = true
pcbcraft-text.workspace = true
pcbcraft-library.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Request", "Response", "console", "Element", "Navigator", "Headers", "RequestInit", "RequestMode", "RequestCredentials"] }
