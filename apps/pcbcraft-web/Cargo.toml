[package]
name = "pcbcraft-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
pcbcraft-ui-egui.workspace = true
pcbcraft-engine.workspace = true
pcbcraft-mcp.workspace = true
pcbcraft-text.workspace = true
pcbcraft-library.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Use minimal eframe without desktop features for wasm
eframe = { version = "0.36", default-features = false, features = ["default_fonts"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Request", "Response", "console", "Element", "Navigator", "Headers", "RequestInit", "RequestMode", "RequestCredentials"] }

# Desktop eframe features
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "persistence", "accesskit"] }
